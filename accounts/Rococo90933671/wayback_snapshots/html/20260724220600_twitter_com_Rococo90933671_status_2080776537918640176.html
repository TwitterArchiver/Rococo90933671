  学日语的时候特别疑惑：日语里的貴様(きさま) 和御前(おまえ)，如果光看汉字，明明是挺高贵的词，为什么却是骂人的话？
  <br/>
  <br/>
  查资料后，发现有一个说法是这样的：江户幕府有对“恶言”（汚い言葉）的禁令，规定不许说“下贱、污秽”的脏话。
  <br/>
  当一个武士愤怒时，他如果骂对方是畜生，那就违反了禁令，而如果他咬牙切齿地说“貴様”，法理上这依然是“敬语”，幕府官吏没法治他的罪
