  <div class="tweet-content">
  當下不少對大陸有一定了解的台灣朋友，常展現出一種微妙的矛盾：他們一方面讚嘆大陸的發展與便捷，享受著大陸的高科技產品與生活方式；另一方面卻又習慣性地脫口而出：“但我就是討厭中國共產黨和中國的制度。”
  <br/>
  <br/>
  表面上看，他們確實親眼見證了大陸的現實發展，卻依然做出對體制的否定。但我們不妨深思：他們對中共與這套制度，真的有過深入且系統性的了解嗎？答案顯然是否定的。
  <br/>
  <br/>
  這種“享受成果卻否定源頭”的言行割裂，本質上並非源於個人獨立思考後的判斷，而是島內長期透過教育、媒體與社會輿論場進行意識形態規訓的必然結果。
