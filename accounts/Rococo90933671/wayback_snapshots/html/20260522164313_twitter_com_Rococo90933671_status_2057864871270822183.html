  2023年，我在大三休学了。
  <br/>
  休学之后，我还是待在学校里，只是不去上课了。虽然情绪忧郁，但是正常生活是没问题的。
  <br/>
  可惜后来，我误入了驻扎在隔壁大学的一个类传销组织。这个以后我会详细讲，这里先不说这个。
  <br/>
  有一天，当我照常去那个组织时，因为会路过隔壁大学附属的公寓楼嘛，所以我就看到楼上某窗户里有一个像是老师的人坐在电脑前。
  <br/>
  我不知道他在干嘛，也不确定他的身份。但是我在看他，他没有看到我，这给了我一种很奇妙的感觉。
  <br/>
  这或许就是一种单向的缘分吧……我似乎很享受这种神秘的感觉
