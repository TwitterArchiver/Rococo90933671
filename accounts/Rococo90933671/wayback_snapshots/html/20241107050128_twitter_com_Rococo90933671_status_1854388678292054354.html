  每日一诗122
  <br/>
  <br/>
  我眷恋的，
  <br/>
  都已离逝。
  <br/>
  那是夜幕下温暖的房间里，
  <br/>
  情欲不再的躯体。
  <br/>
  钢姐是心灵的捕手，
  <br/>
  将我的情愫尽收眼底。
  <br/>
  祂咯咯笑着，
  <br/>
  于黑色天幕的光束中降临。
  <br/>
  祂展露出本真的自我，
  <br/>
  不再胡诌谰语一般的文字。
  <br/>
  可美丽的钢姐，
  <br/>
  终究不敌时间的过隙。
  <br/>
  所以留恋的，
  <br/>
  终究也被钢姐抛弃。
