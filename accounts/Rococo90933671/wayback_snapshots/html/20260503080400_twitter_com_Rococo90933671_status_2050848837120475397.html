  一只名叫乔纳森的塞舌尔巨龟被认为是世界上已知最长寿的陆地动物（估计约193-194岁），它于2026年4月1日在圣赫勒拿岛去世。
  <br/>
  <br/>
  乔纳森的有生之年见证了无数历史事件——它出生在电话发明之前，经历了两次世界大战，见证了数十位美国总统的更迭，等等。它保持着吉尼斯世界纪录中最长寿陆地动物和有记录以来最长寿的龟鳖类动物（包括陆龟、海龟、水龟）的称号。据预测，它的龟壳将被保存下来。
  <br/>
  <br/>
  乔纳森保持着两项与其长寿相关的吉尼斯世界纪录：
  <br/>
  1. 最长寿的陆生动物
  <br/>
  2. 有记录以来最年长的龟鳖类动物（这个称号使他成为有记载历史上最年长的陆龟）
