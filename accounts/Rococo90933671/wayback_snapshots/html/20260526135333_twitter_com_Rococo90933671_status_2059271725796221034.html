  <div class="tweet-content">
  刚刚被蟑螂吓哭了。
  <br/>
  <br/>
  本人从小到大一直怕蟑螂、蜘蛛（当然蜘蛛＞蟑螂），看到都不敢靠近。
  <br/>
  <br/>
  这次这只在厕所门口，不知道为什么一直趴在那里，头上的触角一动一动的，但是即使跺脚它也不走。
  <br/>
  <br/>
  后来实在没招了，又不敢去踩，幸好它的位置很好——可以用开水浇。
  <br/>
  <br/>
  所以只好烧了一点开水，鼓起勇气，确定不会弄身上烫到自己，就一把泼了过去。
  <br/>
  <br/>
  蟑螂挣扎了几下，翻到了，腿在半空中动了几下，手舞足蹈，高兴坏了，然后就安静了。
  <br/>
  <br/>
  怕它假死，又拿拖把过来猛踩，看到它身体损坏了、不再完整了，才放心用剩下的开水冲下下水道。
  <br/>
  <br/>
  做完这一切，真的心力交瘁了
