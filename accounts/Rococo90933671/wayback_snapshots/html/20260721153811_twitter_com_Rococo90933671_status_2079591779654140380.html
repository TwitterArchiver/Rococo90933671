  在尚还年幼的时候就听说了邓丽君，当时对她唯一的印象是：一个早逝的老歌歌手。
  <br/>
  不久后，不记得是在哪个剧里看到，人物甲拿磁带还是啥听邓丽君的歌，然后人物乙不准他听，让他快别听了，说这是靡靡之音。
  <br/>
  当时很不理解，不就是歌而已吗？从小就听各种歌，哪有什么坏处呢？
  <br/>
  后来了解了历史才知道，原来是上世纪，台湾的民国政府把邓丽君塑造成了统战偶像，专门吸引大陆人脱北。所以用收音机听邓丽君，也是偷听敌台。
  <br/>
  顺带一提，小时候爱听的飞儿乐团也是台湾的，哈哈哈，有种奇妙的感觉
