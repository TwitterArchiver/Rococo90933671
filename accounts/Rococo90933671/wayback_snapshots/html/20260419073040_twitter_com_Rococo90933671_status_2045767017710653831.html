  青海西宁南山一公园里的标语。“鹿马”是什么意思？
  <br/>
  <br/>
  冷知识：在藏传佛教中，存在一种仪式用品 “隆达”（lungta），它常被译为“风马 ”“ 禄马”。
  <br/>
  <br/>
  它是一种印有经文的小纸片，人们会在特定场合将它抛撒，象征把祝福交给风，传向远方。这是一种文化风俗，是真实存在的。
  <br/>
  <br/>
  问题在于，字确实写错了。正确写法就是：隆达（藏语），即“禄马”，只是被误写成了“鹿马”。
  <br/>
  <br/>
  所以，“鹿马”其实是错别字。当然，既然是音译，那也没有对错之分
