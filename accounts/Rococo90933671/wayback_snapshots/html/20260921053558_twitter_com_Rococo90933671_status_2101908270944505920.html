  多年来，我发现自己“输不起”的心理特别强大。
  <br/>
  <br/>
  小时候和妈妈下象棋，我输了，气得我把棋盘掀了。
  <br/>
  <br/>
  而且在电子游戏中也体现得特别明显，至今都是如此：只想赢，不想输，输了正常人都会不舒服，但是我会觉得这种不舒服尤其难以忍受。
  <br/>
  <br/>
  所以，我几乎不玩MOBA游戏等竞技游戏，即使玩，也只打“人机对战”，或者索性只玩单人游戏，不论是否要联网，整个游戏过程都只有我一个真人的那种。
  <br/>
  <br/>
  这应该能说明，我的心智太不成熟了吧？在游戏里都受不了，我又怎么可能应对生活的挑战呢……这也是我的焦虑来源吧……
