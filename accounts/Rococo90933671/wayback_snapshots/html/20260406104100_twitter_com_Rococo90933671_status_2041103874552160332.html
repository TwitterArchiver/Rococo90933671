  很多人习惯做的事，就是把难过藏起来，在他人面前只露出快乐的模样。
  <br/>
  你可能是怕身边人担心，更可能是怕你的低落会导致你在身边人心中的好感度降低。
  <br/>
  也可能是因为，我们知道，人都只想跟快乐的人接触，因为多巴胺在精神层面也是可以传染的。
  <br/>

  <br/>

  <br/>
  你还记得自己上一次真切地表达自己的情绪是什么时候吗？
