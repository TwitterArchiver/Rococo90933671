  人在互联网，需要接触的平台往往特别多，每个平台一个账号配一个密码，记不住怎么办？那就只能统一用同一个密码了。
  <br/>
  <br/>
  但是现在问题又来了，不同的平台注册时对密码的规定不一样。有的规定你一定要一个大写字母，有的规定你一定要一个特殊符号，有的则二者兼有。
  <br/>
  <br/>
  可由于自己最初的统一密码两个都没有，所以每次登录一些不常用的平台，往往需要进入注册界面，看看它对于密码的规定，或者索性直接一个一个套。
  <br/>
  <br/>
  所以，如果碰到的是那种限制错误次数而且还给密码规定了大写字母或者特殊符号的平台，就是最操蛋的……
