  有句话是这么说的：“佚之狐言于郑伯曰”，佚之狐的意思是佚这个地方一个叫狐的人。
  <br/>
  狐既然可以当作人名，那假设有一个部族也叫“狐”，然后它起家建立了王朝，就像商周那样，那不就是“狐朝”了？所以“狐”作为国号很合理吧？
  <br/>
  当然，就自己的设定而言，确实从一开始这个推论就错了，因为狐朝之所以是狐朝，是因为开国皇帝，狐太祖高皇帝李奇亮，他有狐臭，一到夏天大老远就能闻到的那种🤓
