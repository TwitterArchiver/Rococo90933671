  <div class="tweet-content">
  单纯地活着其实比想象中难，因为人的大脑传承了亿万年进化而来的本能，为了保证自身和族群的存续，天然地就会复盘过去，考虑将来。
  <br/>
  <br/>
  而这刚好是活在当下的天敌——人们即使理性上明白过去和将来在当下是不存在的，可以选择不为此痛苦，意识层面也做不到。
  <br/>
  <br/>
  试想一个这样的人：不谈恋爱、不乱搞，每天吃了睡，睡了吃，做完固定的任务就啥都不干了，也就给手机充充电。
  <br/>
  <br/>
  这样活着有意义吗？当然可以说没有。但是，能这么单纯地活着而不焦虑，又是多少人的奢望——有意义这件事，有意义吗？
