  冷知识：《诗经·大雅》中并没有“人有所操，我有其道。人有所不操，我有其教”这句话。
  <br/>
  <br/>
  《诗经》全书只有305篇，《大雅》只有31篇，现存文本早已固定，而《大雅》的原文中，如《文王》《大明》《荡》《板》《抑》等篇，都是找不到这句话的。
  <br/>
  <br/>
  网络上广泛流传的“人有所操”出自《诗经·大雅》，基本可以判定为伪出处。
  <br/>
  <br/>
  但这并不重要，我们贯彻这四个字就完了，是正着贯彻还是反着贯彻你别问😋
