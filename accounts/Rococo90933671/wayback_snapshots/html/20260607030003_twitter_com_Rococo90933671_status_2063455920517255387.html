  对于历史，百家讲坛的王立群老师有一个观点非常有参考价值。
  <br/>
  <br/>
  他认为读史有“四个层次”：
  <br/>
  <br/>
  第一层，是“真实的历史”，那是实实在在发生过的事儿，是历史的根；
  <br/>
  第二层，是“记录的历史”，就是史官笔下的记载，相当于树干，带着他们的观察和筛选；
  <br/>
  第三层，是“传播的历史”，就像枝叶，经过口口相传、书籍流传，可能会添油加醋、变形走样；
  <br/>
  第四层，是“接受的历史”，就是每个人心中理解的历史，这是树上结出的果子，口味各异。
  <br/>
  <br/>
  所以，想要接近历史真相，就得一层层剥开。既要看记录，还要辨传播，更要独立思考，形成自己的理解
